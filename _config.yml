title: Slavic Pagan World
url: https://slavicpaganworld.com
markdown: kramdown
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
permalink: /journal/:title/
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      footer_signup: false # articles end with their own signup box
