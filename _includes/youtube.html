{% comment %} Nothing loads from YouTube until the visitor presses play. Pass id= for one video, or playlist= for the newest in a list. Optional image= shows a thumbnail stored on this site. {% endcomment %}
<div class="video{% if include.image %} video-has-image{% endif %}"{% if include.playlist %} data-youtube-playlist="{{ include.playlist }}"{% else %} data-youtube-id="{{ include.id }}"{% endif %} data-title="{{ include.title | escape }}">
  {% if include.image %}<img class="video-thumb" src="{{ include.image | relative_url }}" alt="" loading="lazy">{% endif %}
  <button class="btn btn-secondary video-play" type="button">▶ Play video</button>
  <p class="video-note">Loads from YouTube</p>
</div>
