{% comment %} Signup placeholder. The real MailerLite form goes in here in Phase 4. {% endcomment %}
<section class="newsletter-box{% if include.compact %} newsletter-box-compact{% endif %}">
  <h2 class="newsletter-title">🍄 Get one calendar page free each month</h2>
  <form class="newsletter-form" onsubmit="return false">
    <label class="newsletter-email">
      <span class="visually-hidden">Email address</span>
      <input type="email" placeholder="Your email" autocomplete="email">
    </label>
    <button class="btn btn-primary" type="submit">Sign up</button>
    <label class="newsletter-consent">
      <input type="checkbox">
      <span>[IZA: consent wording]</span>
    </label>
  </form>
</section>
