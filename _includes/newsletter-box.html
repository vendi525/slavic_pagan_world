{% comment %} Signups are saved to a Google Sheet, see tools/newsletter-sheet.gs. {% endcomment %}
<section class="newsletter-box{% if include.compact %} newsletter-box-compact{% endif %}">
  <h2 class="newsletter-title">🍄 Get one calendar page free each month</h2>
  <form class="newsletter-form" method="post" data-newsletter{% if site.newsletter_endpoint != "" %} action="{{ site.newsletter_endpoint }}"{% endif %}>
    <label class="newsletter-email">
      <span class="visually-hidden">Email address</span>
      <input type="email" name="email" placeholder="Your email" autocomplete="email" required>
    </label>
    <button class="btn btn-primary" type="submit">Sign up</button>
    <label class="newsletter-website" aria-hidden="true">
      Website
      <input type="text" name="website" tabindex="-1" autocomplete="off">
    </label>
    <label class="newsletter-consent">
      <input type="checkbox" name="consent" value="yes" required>
      <span>Send me one free calendar page each month. I can unsubscribe anytime using the link in any email. <a href="/privacy/">Privacy</a></span>
    </label>
    <p class="newsletter-status" role="status"></p>
  </form>
</section>
