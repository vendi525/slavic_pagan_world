{% assign product = include.product %}
<div class="buy-box">
  {% if product.site_buy_url and product.site_buy_url != "" %}
  <a class="btn btn-primary" href="{{ product.site_buy_url }}">Order now</a>
  <a class="btn btn-secondary" href="{{ product.etsy_url }}">Buy on Etsy</a>
  {% else %}
  <a class="btn btn-primary" href="{{ product.etsy_url }}">Buy on Etsy</a>
  {% endif %}
</div>
