{% assign product = include.product %}
<div class="buy-box">

  <a class="btn btn-primary" href="{{ product.etsy_url }}">Order now</a>
  {% if product.etsy_digital_url %}<a class="btn btn-secondary" href="{{ product.etsy_digital_url }}">Digital download</a>{% endif %}
</div>
