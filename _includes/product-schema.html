{% assign calendar = site.data.products.first %}
{% assign priced = calendar.formats | where_exp: "f", "f.price_number != ''" | where_exp: "f", "f.etsy_url != '#'" %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Product",
  "name": {{ calendar.title | jsonify }},
  "description": {{ page.description | jsonify }},
  "image": {{ calendar.image | absolute_url | jsonify }}{% if priced.size > 0 %},
  "offers": [{% for f in priced %}
    {
      "@type": "Offer",
      "name": {{ f.label | jsonify }},
      "price": {{ f.price_number | jsonify }},
      "priceCurrency": {{ calendar.price_currency | jsonify }},
      "availability": "https://schema.org/InStock",
      "url": {{ f.etsy_url | jsonify }}
    }{% unless forloop.last %},{% endunless %}{% endfor %}
  ]{% endif %}
}
</script>
