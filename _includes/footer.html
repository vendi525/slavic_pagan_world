<footer class="site-footer">
  <div class="site-footer-inner">
    {% unless page.footer_signup == false %}{% include newsletter-box.html compact=true %}{% endunless %}
    <ul class="footer-links" aria-label="Find me elsewhere">
      {% for item in site.data.links.social %}
      <li><a href="{{ item.url }}">{{ item.label }}</a></li>
      {% endfor %}
    </ul>
    <ul class="footer-links footer-links-small" aria-label="Legal">
      {% for item in site.data.links.legal %}
      <li><a href="{{ item.url }}">{{ item.label }}</a></li>
      {% endfor %}
      <li><button class="link-button" type="button" data-cookie-settings>Cookie settings</button></li>
    </ul>
  </div>
</footer>
